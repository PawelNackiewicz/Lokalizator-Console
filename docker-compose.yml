# At this stage ONLY the database is containerised.
# The backend (apps/api) and web app (apps/web) run locally through `pnpm dev`.
services:
  postgres:
    image: postgres:17-alpine
    container_name: lokalizator-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lokalizator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lokalizator}
      POSTGRES_DB: ${POSTGRES_DB:-lokalizator}
    ports:
      # host:container — the host port is configurable so it does not clash with a local Postgres.
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Lets you wait for the database to be ready: `docker compose up -d --wait`
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-lokalizator} -d ${POSTGRES_DB:-lokalizator}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
    name: lokalizator-postgres-data
