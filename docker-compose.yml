# Na tym etapie konteneryzujemy WYŁĄCZNIE bazę danych.
# Backend (apps/api) i frontend (apps/web) uruchamiamy lokalnie przez `pnpm dev`.
services:
  postgres:
    image: postgres:17-alpine
    container_name: lokalizator-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lokalizator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lokalizator}
      POSTGRES_DB: ${POSTGRES_DB:-lokalizator}
    ports:
      # Host:kontener — port hosta konfigurowalny, żeby nie kolidować z lokalnym Postgresem.
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # Pozwala poczekać na gotowość bazy: `docker compose up -d --wait`
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-lokalizator} -d ${POSTGRES_DB:-lokalizator}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
    name: lokalizator-postgres-data
