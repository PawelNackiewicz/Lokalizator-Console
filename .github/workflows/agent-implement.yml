name: Agent — implement issue

# Labelling an issue `ready` hands it to Claude: it implements the change on a
# `claude/issue-N-*` branch, runs the full definition of done, and this workflow
# opens the PR. Anything Claude cannot finish is handed back with `needs-human`.

on:
  issues:
    types: [labeled]

concurrency:
  group: agent-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  implement:
    if: github.event.label.name == 'ready'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lokalizator
          POSTGRES_PASSWORD: lokalizator
          POSTGRES_DB: lokalizator
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lokalizator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: pnpm --filter @lokalizator/e2e exec playwright install --with-deps chromium
      - run: pnpm db:migrate
      - run: pnpm db:seed

      - id: claude
        uses: anthropics/claude-code-action@v1
        with:
          # Set ONE of these repository secrets; the other stays empty.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          label_trigger: ready
          claude_args: |
            --model ${{ vars.AGENT_MODEL_IMPLEMENT || 'claude-sonnet-5-5' }}
            --max-turns 100
            --allowedTools "Bash(pnpm:*),Bash(npx playwright:*),Bash(gh pr create:*),Bash(gh pr view:*)"
            --append-system-prompt "You are the implementer agent of this repository's software factory. Implement exactly what the issue asks and nothing more. Follow CLAUDE.md. The database is already migrated and seeded and Playwright is installed. Before committing you must run pnpm format, then pnpm verify and pnpm test:e2e, and both must pass. If the issue is ambiguous, would require changes in a high-risk area it does not mention, or you cannot get the checks green, do not push partial work: explain in your comment exactly what blocked you and stop. You cannot push changes to files under .github/workflows (the token lacks that permission): if the issue needs one, implement everything else, leave the workflow file untouched, and put the exact workflow change in the PR body for a human to apply. When the checks pass, push your commits and open the pull request yourself with gh pr create --base main --label agent, a concise conventional-commit style title, and a body that starts with Closes #${{ github.event.issue.number }}, summarises the change in Polish, and ends with the line: Generated with [Claude Code](https://claude.com/claude-code). Then put the PR link in your comment instead of a Create PR link."

      # Claude opens the PR itself while its App token is valid — a PR opened with the
      # Actions token would not trigger CI. The action revokes its token on exit, so this
      # step only finds the PR, or opens one with the Actions token as a fallback.
      - name: Find or open pull request
        id: pr
        if: steps.claude.outputs.branch_name != ''
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.claude.outputs.branch_name }}
          ISSUE: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # The action reports a branch name even when Claude stopped before pushing.
          if ! gh api "repos/$GITHUB_REPOSITORY/branches/$BRANCH" --silent 2>/dev/null; then
            echo "Claude pushed nothing — branch $BRANCH does not exist."
            exit 0
          fi
          ahead=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$BRANCH" --jq .ahead_by)
          if [ "$ahead" = "0" ]; then
            echo "Claude pushed no commits."
            exit 0
          fi
          existing=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -z "$existing" ]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --label agent \
              --title "$TITLE" \
              --body "$(printf 'Closes #%s\n\nImplemented by the agent workflow: %s\n\nCI nie rusza automatycznie dla PR otwartych tokenem Actions: zamknij i otwórz PR ponownie, żeby je uruchomić.\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)' "$ISSUE" "$RUN_URL")"
          fi
          echo "opened=true" >> "$GITHUB_OUTPUT"

      - name: Hand back to a human
        if: always() && steps.pr.outputs.opened != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label ready --add-label needs-human
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" \
            --body "Agent nie otworzył PR. Szczegóły w komentarzu Claude powyżej i w logu: $RUN_URL"

      - name: Mark issue as in review
        if: steps.pr.outputs.opened == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label ready --add-label pr-open
