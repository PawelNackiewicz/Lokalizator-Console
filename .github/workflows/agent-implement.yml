name: Agent — implement issue

# Labelling an issue `ready` hands it to Claude: it implements the change on a
# `claude/issue-N-*` branch, runs the full definition of done, and this workflow
# opens the PR. Anything Claude cannot finish is handed back with `needs-human`.

on:
  issues:
    types: [labeled]

concurrency:
  group: agent-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  implement:
    if: github.event.label.name == 'ready'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lokalizator
          POSTGRES_PASSWORD: lokalizator
          POSTGRES_DB: lokalizator
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lokalizator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cp .env.example .env
      - run: pnpm --filter @lokalizator/e2e exec playwright install --with-deps chromium
      - run: pnpm db:migrate
      - run: pnpm db:seed

      - id: claude
        uses: anthropics/claude-code-action@v1
        with:
          # Set ONE of these repository secrets; the other stays empty.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          label_trigger: ready
          claude_args: |
            --model ${{ vars.AGENT_MODEL_IMPLEMENT || 'claude-sonnet-5-5' }}
            --max-turns 100
            --allowedTools "Bash(pnpm:*),Bash(npx playwright:*)"
            --append-system-prompt "You are the implementer agent of this repository's software factory. Implement exactly what the issue asks and nothing more. Follow CLAUDE.md. The database is already migrated and seeded and Playwright is installed. Before committing you must run pnpm format, then pnpm verify and pnpm test:e2e, and both must pass. If the issue is ambiguous, would require changes in a high-risk area it does not mention, or you cannot get the checks green, do not push partial work: explain in your comment exactly what blocked you and stop. Do not post a Create PR link; the workflow opens the pull request itself."

      - name: Open pull request
        id: pr
        if: steps.claude.outputs.branch_name != ''
        env:
          GH_TOKEN: ${{ steps.claude.outputs.github_token }}
          BRANCH: ${{ steps.claude.outputs.branch_name }}
          ISSUE: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          ahead=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$BRANCH" --jq .ahead_by 2>/dev/null || echo 0)
          if [ "$ahead" = "0" ]; then
            echo "Claude pushed no commits."
            exit 0
          fi
          existing=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            echo "opened=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh pr create --base main --head "$BRANCH" --label agent \
            --title "$TITLE" \
            --body "$(printf 'Closes #%s\n\nImplemented by the agent workflow: %s\n\n🤖 Generated with [Claude Code](https://claude.com/claude-code)' "$ISSUE" "$RUN_URL")"
          echo "opened=true" >> "$GITHUB_OUTPUT"

      - name: Hand back to a human
        if: always() && steps.pr.outputs.opened != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label ready --add-label needs-human
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" \
            --body "Agent nie otworzył PR. Szczegóły w komentarzu Claude powyżej i w logu: $RUN_URL"

      - name: Mark issue as in review
        if: steps.pr.outputs.opened == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --remove-label ready --add-label pr-open
